[project]
name = "procon-python-env"
version = "0.1.0"
description = "Python environment for competitive programming"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ac-library-python==0.1.0",
    "acl-cpp-python==0.6.2",
    "bitarray==3.8.0",
    "cppyy==3.5.0",
    "more-itertools==10.8.0",
    "mpmath==1.3.0",
    "networkx==3.5",
    "numpy==2.3.4",
    "pandas==2.3.1",
    "PuLP==3.3.0",
    "python-dateutil==2.9.0.post0",
    "pytz==2025.2",
    "six==1.17.0",
    "sortedcontainers==2.4.0",
    "sympy==1.14.0",
    "tzdata==2025.2",
    "z3-solver==4.15.4.0",
]

[dependency-groups]
dev = [
    "ruff",
    "pyright[nodejs]",
    "pytest",
    "isort>=8.0.1",
]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py311"
extend-exclude = [
    ".venv",
    ".ruff_cache",
    "__pycache__",
    "in",
    "out",
    "lib/**",
    ".tmp/**",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # 行長。競プロでは長い式・入力処理を許したい
    "E741",  # l, O, I を許す
    "B905",  # zip(..., strict=...) 要求をしない
    "F401",  # 未使用 import を許す
    "UP046", # Generics の利用を許可する
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
include = ["."]
exclude = [
    ".venv",
    ".ruff_cache",
    "__pycache__",
    "in",
    "out",
    "testcases",
    "**/node_modules",
    "**/.*",
]
pythonVersion = "3.11"
pythonPlatform = "Linux"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

# 競プロ用にノイズを抑える
reportMissingTypeStubs = "none"
reportWildcardImportFromLibrary = "none"

# 未使用系は Ruff に任せる
reportUnusedImport = "none"
reportUnusedVariable = "none"

[tool.isort]
profile = "black"
line_length = 120
py_version = 311
float_to_top = true

[[tool.uv.dependency-metadata]]
name = "cppyy"
version = "3.5.0"
requires-dist = [
    "CPyCppyy==1.13.0; platform_python_implementation == 'CPython'",
    "cppyy-backend==1.15.3",
    "cppyy-cling==6.32.8",
]